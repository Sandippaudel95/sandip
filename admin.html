<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Consultation Admin | Sandip Paudel</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a2540'/%3E%3Ctext x='50' y='68' font-family='Georgia' font-size='56' font-weight='600' fill='white' text-anchor='middle'%3ESP%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/booking.css">
</head>
<body class="admin-body">

    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <span class="brand-mark">SP</span>
                <span class="brand-name">Consultation admin</span>
            </a>
            <div class="admin-user" id="adminUser" hidden>
                <span id="adminEmail"></span>
                <a class="btn-ghost" href="booking.html" target="_blank" rel="noopener">View booking page</a>
                <button type="button" class="btn-ghost" id="signOut">Sign out</button>
            </div>
        </div>
    </header>

    <main class="admin-main">
        <div class="container">


            <!-- Sign in -->
            <section class="login-card" id="loginView" hidden>
                <h1>Sign in</h1>
                <p>Use the admin account you created in Supabase.</p>
                <form id="loginForm" novalidate>
                    <div class="form-row">
                        <label for="lEmail">Email</label>
                        <input type="email" id="lEmail" required autocomplete="username">
                    </div>
                    <div class="form-row">
                        <label for="lPassword">Password</label>
                        <input type="password" id="lPassword" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-submit" id="lSubmit"><span>Sign in</span></button>
                    <p class="form-status" id="lStatus" role="status" aria-live="polite"></p>
                    <p class="help"><button type="button" class="linkish" id="forgotBtn">Forgot your password?</button></p>
                </form>
            </section>

            <!-- Set a new password (after following a reset email) -->
            <section class="login-card" id="resetView" hidden>
                <h1>Set a new password</h1>
                <p>Choose a password with at least 8 characters.</p>
                <form id="resetForm" novalidate>
                    <div class="form-row">
                        <label for="rPassword">New password</label>
                        <input type="password" id="rPassword" minlength="8" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-submit"><span>Save password</span></button>
                    <p class="form-status" id="rStatus" role="status" aria-live="polite"></p>
                </form>
            </section>

            <!-- Dashboard -->
            <section id="dashView" hidden>
                <div class="admin-top">
                    <h1>Consultations</h1>
                    <button type="button" class="btn-ghost" id="refreshBtn"><i class="fas fa-rotate" aria-hidden="true"></i> Refresh</button>
                </div>

                <div class="tabs" role="tablist" aria-label="Admin sections">
                    <button class="tab" role="tab" id="tab-verify" aria-controls="panel" aria-selected="true" data-tab="verify">To verify <span class="count" id="cVerify">0</span></button>
                    <button class="tab" role="tab" id="tab-held" aria-controls="panel" aria-selected="false" data-tab="held">Awaiting payment <span class="count" id="cHeld">0</span></button>
                    <button class="tab" role="tab" id="tab-upcoming" aria-controls="panel" aria-selected="false" data-tab="upcoming">Confirmed <span class="count" id="cUpcoming">0</span></button>
                    <button class="tab" role="tab" id="tab-history" aria-controls="panel" aria-selected="false" data-tab="history">History</button>
                    <button class="tab" role="tab" id="tab-slots" aria-controls="panel" aria-selected="false" data-tab="slots">Time slots</button>
                    <button class="tab" role="tab" id="tab-rates" aria-controls="panel" aria-selected="false" data-tab="rates">Services and fees</button>
                    <button class="tab" role="tab" id="tab-payment" aria-controls="panel" aria-selected="false" data-tab="payment">Payment details</button>
                </div>

                <div id="panel" role="tabpanel" tabindex="-1"></div>
            </section>
        </div>
    </main>

    <!-- Confirm / cancel dialog -->
    <dialog class="dialog" id="actionDialog">
        <form method="dialog" id="actionForm">
            <h2 id="dlgTitle"></h2>
            <p class="dlg-sub" id="dlgSub"></p>
            <div class="form-row">
                <label for="dlgNote" id="dlgNoteLabel"></label>
                <textarea id="dlgNote" rows="4" maxlength="2000"></textarea>
            </div>
            <label class="check-row"><input type="checkbox" id="dlgNotify" checked> Email the client</label>
            <div class="dlg-actions">
                <button type="button" class="btn-ghost" id="dlgCancel">Back</button>
                <button type="submit" class="btn-submit" id="dlgOk"><span></span></button>
            </div>
        </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="assets/js/booking-config.js"></script>
    <script src="assets/js/admin.js" defer></script>
</body>
</html>
