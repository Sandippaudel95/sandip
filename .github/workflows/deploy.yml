name: Deploy to GitHub Pages

# Only main deploys, so work on other branches never touches the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Optional: set these as repository variables to supply the
          # scheduling link at build time instead of editing src/lib/booking.ts.
          NEXT_PUBLIC_BOOKING_PROVIDER: ${{ vars.NEXT_PUBLIC_BOOKING_PROVIDER }}
          NEXT_PUBLIC_BOOKING_LINK: ${{ vars.NEXT_PUBLIC_BOOKING_LINK }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
